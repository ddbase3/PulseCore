level_1_desc = "Deliver the blue Ion pulse to the empty core. Rotate the wires into one continuous route."
level_2_desc = "Two energies, two separate routes. Deliver each pulse to its matching core without crossing paths."
level_3_desc = "Combine Ion and Plasma inside the mixer. Only violet Fusion energy can activate this core."
level_4_desc = "The generator sends two pulses. Route the first upward, then toggle LIVE to send the second downward."
level_5_desc = "Both pulses must arrive on the same tick. Set the delay before launching the energy."
level_6_desc = "Create two Fusion pulses. Supply the upper core first, then the lower core. Make every element work together."
level_1_hint = "Go right from the generator, then up. Follow the second row to the right, then head down to the core."
level_2_hint = "Ion takes the upper route with a bend through the middle. Plasma stays low and moves up one row in column C."
level_3_hint = "Ion enters from above, Plasma from the left. Fusion exits the diamond on the right, then turns downward."
level_4_hint = "Wait until the first pulse has passed the LIVE switch. Toggle downward between ticks 3 and 7."
level_5_hint = "The red path takes four ticks. The blue path takes two plus the delay: set HOLD to 2."
level_6_hint = "Mix at C4 and route through D4 to LIVE at E4. Toggle down after the first pulse has passed, before tick 13."
