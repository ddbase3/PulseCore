level_7_title = "Relay lanes"
level_7_short = "Relay lanes"
level_7_desc = "Two separate routes, two pulses each. Every core needs two charges."
level_7_hint = "Ion takes the upper loop. Plasma stays below. Keep both routes open after the first charge."
level_8_title = "Three relays"
level_8_short = "Three relays"
level_8_desc = "Supply three cores from one generator. Two LIVE switches distribute the pulse sequence."
level_8_hint = "Toggle C4 downward after the first pulse. E5 then distributes the remaining two pulses."
level_9_title = "Detour"
level_9_short = "Detour"
level_9_desc = "Find both input routes into the mixer and send the new energy to the violet core. Watch the emission schedule."
level_9_hint = "The diamond accepts energy from above and left. Its shared output is on the right."
level_10_title = "Light arc"
level_10_short = "Light arc"
level_10_desc = "Find both input routes into the mixer and send the new energy to the violet core. Watch the emission schedule."
level_10_hint = "The diamond accepts energy from above and left. Its shared output is on the right."
level_11_title = "Three frequencies"
level_11_short = "Three frequencies"
level_11_desc = "Three energies travel simultaneously. Keep their routes and target cores separate."
level_11_hint = "Blue stays above, red in the middle, violet below. Match the fixed target symbols."
level_12_title = "Double fusion"
level_12_short = "Double fusion"
level_12_desc = "Find both input routes into the mixer and send the new energy to the violet core. Watch the emission schedule."
level_12_hint = "The diamond accepts energy from above and left. Its shared output is on the right."
level_13_title = "Twin prism"
level_13_short = "Twin prism"
level_13_desc = "Two independent mixers supply separate cores. Keep every signal in its own circuit."
level_13_hint = "Solve the upper and lower circuit separately. Each mixer needs two different input energies."
level_14_title = "Prism sequence"
level_14_short = "Prism sequence"
level_14_desc = "Find both input routes into the mixer and send the new energy to the violet core. Watch the emission schedule."
level_14_hint = "The diamond accepts energy from above and left. Its shared output is on the right."
level_15_title = "Spectrum buffer"
level_15_short = "Spectrum buffer"
level_15_desc = "Find both input routes into the mixer and send the new energy to the violet core. Watch the emission schedule."
level_15_hint = "Set HOLD to 2. The diamond accepts energy from above and left. Its shared output is on the right."
level_16_title = "Spectrum core"
level_16_short = "Spectrum core"
level_16_desc = "Two independent mixers supply separate cores. Keep every signal in its own circuit."
level_16_hint = "Solve the upper and lower circuit separately. Each mixer needs two different input energies."
level_17_title = "Fork point"
level_17_short = "Fork point"
level_17_desc = "Align the wires. Route pulses alternately upward and downward without overloading a core."
level_17_hint = "LIVE starts upward. Wait for each pulse to pass before switching direction."
level_18_title = "Long approach"
level_18_short = "Long approach"
level_18_desc = "Align the wires. Route pulses alternately upward and downward without overloading a core."
level_18_hint = "LIVE starts upward. Wait for each pulse to pass before switching direction."
level_19_title = "Change of course"
level_19_short = "Change of course"
level_19_desc = "Align the wires. Route pulses alternately upward and downward without overloading a core."
level_19_hint = "LIVE starts upward. Wait for each pulse to pass before switching direction."
level_20_title = "Dual control"
level_20_short = "Dual control"
level_20_desc = "Two LIVE switches control different energies. The generators start at different times."
level_20_hint = "Switch the upper circuit first, then the lower two ticks later. Every upper branch needs one pulse."
level_21_title = "Relay chain"
level_21_short = "Relay chain"
level_21_desc = "Three targets, two branches and a longer approach. Plan the switching sequence."
level_21_hint = "The first pulse reaches C4 at tick 5. Then route down; toggle E5 only after the second pulse."
level_22_title = "Four pulses"
level_22_short = "Four pulses"
level_22_desc = "Align the wires. Route pulses alternately upward and downward without overloading a core."
level_22_hint = "LIVE starts upward. Wait for each pulse to pass before switching direction."
level_23_title = "Phase shift"
level_23_short = "Phase shift"
level_23_desc = "Two LIVE switches control different energies. The generators start at different times."
level_23_hint = "Switch the upper circuit first, then the lower two ticks later. Every upper branch needs one pulse."
level_24_title = "Flux distributor"
level_24_short = "Flux distributor"
level_24_desc = "Create three fusion pulses and distribute them to three target cores."
level_24_hint = "Keep D4 upward at first, then switch down. F5 separates the second and third fusion."
level_25_title = "Time offset"
level_25_short = "Time offset"
level_25_desc = "Match route lengths and HOLD delays. Only correctly timed pulse pairs produce fusion."
level_25_hint = "HOLD: C2 = 2. Both inputs must arrive within the fusion window."
level_26_title = "Three ticks"
level_26_short = "Three ticks"
level_26_desc = "Match route lengths and HOLD delays. Only correctly timed pulse pairs produce fusion."
level_26_hint = "HOLD: E2 = 3. Both inputs must arrive within the fusion window."
level_27_title = "Double buffer"
level_27_short = "Double buffer"
level_27_desc = "Match route lengths and HOLD delays. Only correctly timed pulse pairs produce fusion."
level_27_hint = "HOLD: C2 = 2, C4 = 3. Both inputs must arrive within the fusion window."
level_28_title = "Two clocks"
level_28_short = "Two clocks"
level_28_desc = "Synchronize two separate mixers. Their delays differ."
level_28_hint = "C2 needs HOLD 3, E5 needs HOLD 2. Check both circuits before launch."
level_29_title = "Resonance window"
level_29_short = "Resonance window"
level_29_desc = "Match route lengths and HOLD delays. Only correctly timed pulse pairs produce fusion."
level_29_hint = "HOLD: D2 = 2. Both inputs must arrive within the fusion window."
level_30_title = "Cadence"
level_30_short = "Cadence"
level_30_desc = "Match route lengths and HOLD delays. Only correctly timed pulse pairs produce fusion."
level_30_hint = "HOLD: D2 = 1, D3 = 2. Both inputs must arrive within the fusion window."
level_31_title = "Late fusion"
level_31_short = "Late fusion"
level_31_desc = "The first blue pulse supplies the upper core. The second meets plasma below."
level_31_hint = "Toggle C3 after the first pulse. Plasma starts at tick 12; the second blue route must not take a detour."
level_32_title = "Resonance matrix"
level_32_short = "Resonance matrix"
level_32_desc = "Delay, fusion and two LIVE branches must work together."
level_32_hint = "Set B2 HOLD to 2. D4 sends the second and third fusion downward; F5 separates them."
level_33_title = "Hardwired"
level_33_short = "Hardwired"
level_33_desc = "Some modules are locked. Find a continuous route through their fixed contacts."
level_33_hint = "The route runs right across the top, back through row 3 and right again below. Fixed contacts show the route."
level_34_title = "Divided field"
level_34_short = "Divided field"
level_34_desc = "Two pulse trains, fixed contacts and dead ends. Every connection must align."
level_34_hint = "Blue uses the upper edge, red stays below row 4. Leave the dead ends unused."
level_35_title = "Sealed prism"
level_35_short = "Sealed prism"
level_35_desc = "Create two fusions between blocked and locked conduits."
level_35_hint = "The left input comes from the lower-left corner. The output leaves right and climbs upward."
level_36_title = "Bottleneck"
level_36_short = "Bottleneck"
level_36_desc = "Four pulses pass a fixed conduit. LIVE decides their destination."
level_36_hint = "After each passage at D4, alternate downward and upward. Both cores need two pulses."
level_37_title = "Controlled delay"
level_37_short = "Controlled delay"
level_37_desc = "Fixed contacts leave little room. Match HOLD to the plasma source."
level_37_hint = "Set C2 HOLD to 3. Fusion forms at C5 and climbs along the right side."
level_38_title = "The long way"
level_38_short = "The long way"
level_38_desc = "One conduit winds across the field. Fixed elbows determine the order."
level_38_hint = "First cross the top row rightward, return left on row 2, then use A3 to enter row 4 rightward."
level_39_title = "Locked frequency"
level_39_short = "Locked frequency"
level_39_desc = "Two mixers work simultaneously in a partly sealed network."
level_39_hint = "Set lower-circuit D5 HOLD to 1. The two networks share no wire."
level_40_title = "Interference core"
level_40_short = "Interference core"
level_40_desc = "Stabilize three cores despite locked contacts and an upstream delay."
level_40_hint = "Set B2 HOLD to 1. Toggle D4 after the first fusion, F5 after the second."
level_41_title = "Binary star"
level_41_short = "Binary star"
level_41_desc = "Two synchronized circuits each create three fusions. Target capacities are exact."
level_41_hint = "Set C2 HOLD to 2 and E5 HOLD to 3. Keep both conduits open for the whole sequence."
level_42_title = "Sixfold pulse"
level_42_short = "Sixfold pulse"
level_42_desc = "Six fusion pulses share a wire. Each target core needs three charges."
level_42_hint = "Alternate D3 LIVE five times, each time after a pulse passes."
level_43_title = "Deep resonance"
level_43_short = "Deep resonance"
level_43_desc = "Two delays synchronize three pulse pairs. A wrong setting breaks the sequence."
level_43_hint = "Set D2 to 3 and D4 to 2. Their sum determines the pairing at the mixer."
level_44_title = "Return signal"
level_44_short = "Return signal"
level_44_desc = "The fourth pulse must return to the first core. Plan three switching moments."
level_44_hint = "Switch C4 down after the first signal and up after the third. E5 separates the middle signals."
level_45_title = "Prism network"
level_45_short = "Prism network"
level_45_desc = "Eight fusions charge two cores. Watch the short pulse spacing and the buffer."
level_45_hint = "Set D5 HOLD to 3. Each core needs four fusions, not one."
level_46_title = "Magnetic storage"
level_46_short = "Magnetic storage"
level_46_desc = "A buffer delays the entire plasma train before the LIVE switch."
level_46_hint = "Set A2 HOLD to 3. The switching moment matters only after arrival at LIVE."
level_47_title = "Final relay"
level_47_short = "Final relay"
level_47_desc = "Fusion, HOLD and two LIVE switches with constrained contacts."
level_47_hint = "Set B2 to 3. Switch D4 downward first, then F5. Each target gets exactly one fusion."
level_48_title = "Singularity"
level_48_short = "Singularity"
level_48_desc = "The final core demands four fusions: one upward, two on separate lower routes, then the last upward again."
level_48_hint = "Set B2 HOLD to 2. Switch D4 down after the first pulse, back up after the third. Toggle F5 after its first passage."
