level_17_title = "Gabelpunkt"
level_17_short = "Gabelpunkt"
level_17_desc = "Richte die Leitungen aus. Lenke die Impulse abwechselnd nach oben und unten, ohne einen Reaktor zu überladen."
level_17_hint = "LIVE beginnt oben. Warte jeweils auf die Passage eines Impulses, bevor du die Richtung wechselst."
level_18_title = "Langer Anlauf"
level_18_short = "Langer Anlauf"
level_18_desc = "Richte die Leitungen aus. Lenke die Impulse abwechselnd nach oben und unten, ohne einen Reaktor zu überladen."
level_18_hint = "LIVE beginnt oben. Warte jeweils auf die Passage eines Impulses, bevor du die Richtung wechselst."
level_19_title = "Richtungswechsel"
level_19_short = "Richtungswechsel"
level_19_desc = "Richte die Leitungen aus. Lenke die Impulse abwechselnd nach oben und unten, ohne einen Reaktor zu überladen."
level_19_hint = "LIVE beginnt oben. Warte jeweils auf die Passage eines Impulses, bevor du die Richtung wechselst."
level_20_title = "Doppelsteuerung"
level_20_short = "Doppelsteuerung"
level_20_desc = "Zwei LIVE-Schalter steuern verschiedene Energiearten. Die Generatoren starten versetzt."
level_20_hint = "Oben zuerst umschalten, unten zwei Takte später. Jede obere Abzweigung bekommt genau einen Impuls."
level_21_title = "Relaiskette"
level_21_short = "Relaiskette"
level_21_desc = "Drei Ziele, zwei Verzweigungen und ein verlängerter Zulauf. Plane die Folge der Schaltungen."
level_21_hint = "Der erste Impuls erreicht C4 in Takt 5. Danach nach unten; E5 erst nach dem zweiten Impuls umlegen."
level_22_title = "Vier Impulse"
level_22_short = "Vier Impulse"
level_22_desc = "Richte die Leitungen aus. Lenke die Impulse abwechselnd nach oben und unten, ohne einen Reaktor zu überladen."
level_22_hint = "LIVE beginnt oben. Warte jeweils auf die Passage eines Impulses, bevor du die Richtung wechselst."
level_23_title = "Phasenwechsel"
level_23_short = "Phasenwechsel"
level_23_desc = "Zwei LIVE-Schalter steuern verschiedene Energiearten. Die Generatoren starten versetzt."
level_23_hint = "Oben zuerst umschalten, unten zwei Takte später. Jede obere Abzweigung bekommt genau einen Impuls."
level_24_title = "Fluxverteiler"
level_24_short = "Fluxverteiler"
level_24_desc = "Erzeuge drei Fusionen und verteile sie auf drei Zielreaktoren."
level_24_hint = "D4 zuerst oben lassen, dann nach unten. F5 trennt die zweite und dritte Fusion."
level_25_title = "Zeitversatz"
level_25_short = "Zeitversatz"
level_25_desc = "Stimme die Weglängen und HOLD-Verzögerungen aufeinander ab. Nur rechtzeitig gepaarte Impulse ergeben Fusion."
level_25_hint = "HOLD: C2 = 2. Beide Eingänge müssen innerhalb des Fusionsfensters eintreffen."
level_26_title = "Drei Takte"
level_26_short = "Drei Takte"
level_26_desc = "Stimme die Weglängen und HOLD-Verzögerungen aufeinander ab. Nur rechtzeitig gepaarte Impulse ergeben Fusion."
level_26_hint = "HOLD: E2 = 3. Beide Eingänge müssen innerhalb des Fusionsfensters eintreffen."
level_27_title = "Doppelbuffer"
level_27_short = "Doppelbuffer"
level_27_desc = "Stimme die Weglängen und HOLD-Verzögerungen aufeinander ab. Nur rechtzeitig gepaarte Impulse ergeben Fusion."
level_27_hint = "HOLD: C2 = 2, C4 = 3. Beide Eingänge müssen innerhalb des Fusionsfensters eintreffen."
level_28_title = "Zwei Uhren"
level_28_short = "Zwei Uhren"
level_28_desc = "Synchronisiere zwei getrennte Mischer. Ihre Verzögerungen sind unterschiedlich."
level_28_hint = "C2 braucht HOLD 3, E5 braucht HOLD 2. Prüfe beide Kreise vor dem Start."
level_29_title = "Resonanzfenster"
level_29_short = "Resonanzfenster"
level_29_desc = "Stimme die Weglängen und HOLD-Verzögerungen aufeinander ab. Nur rechtzeitig gepaarte Impulse ergeben Fusion."
level_29_hint = "HOLD: D2 = 2. Beide Eingänge müssen innerhalb des Fusionsfensters eintreffen."
level_30_title = "Taktfolge"
level_30_short = "Taktfolge"
level_30_desc = "Stimme die Weglängen und HOLD-Verzögerungen aufeinander ab. Nur rechtzeitig gepaarte Impulse ergeben Fusion."
level_30_hint = "HOLD: D2 = 1, D3 = 2. Beide Eingänge müssen innerhalb des Fusionsfensters eintreffen."
level_31_title = "Späte Fusion"
level_31_short = "Späte Fusion"
level_31_desc = "Der erste blaue Impuls versorgt den oberen Reaktor. Der zweite trifft unten auf Plasma."
level_31_hint = "C3 nach dem ersten Impuls umlegen. Plasma startet erst in Takt 12; die zweite blaue Route darf keinen Umweg nehmen."
level_32_title = "Resonanzmatrix"
level_32_short = "Resonanzmatrix"
level_32_desc = "Verzögerung, Fusion und zwei LIVE-Verzweigungen müssen zusammenarbeiten."
level_32_hint = "HOLD B2 auf 2. D4 lenkt die zweite und dritte Fusion nach unten; F5 verteilt sie getrennt."
level_33_title = "Festverdrahtet"
level_33_short = "Festverdrahtet"
level_33_desc = "Einige Module sind verriegelt. Finde einen durchgehenden Weg durch die vorgegebenen Kontakte."
level_33_hint = "Der Weg läuft oben nach rechts, in Reihe 3 zurück und unten erneut nach rechts. Feste Kontakte zeigen die Richtung."
level_34_title = "Geteiltes Feld"
level_34_short = "Geteiltes Feld"
level_34_desc = "Zwei Impulsfolgen, feste Kontakte und Sackgassen. Jede Verbindung muss stimmen."
level_34_hint = "Die blaue Leitung nutzt den oberen Rand, die rote bleibt unter Reihe 4. Sackgassen bleiben ungenutzt."
level_35_title = "Versiegeltes Prisma"
level_35_short = "Versiegeltes Prisma"
level_35_desc = "Erzeuge zwei Fusionen zwischen blockierten und verriegelten Leitungen."
level_35_hint = "Der linke Eingang kommt aus der unteren linken Ecke. Der Ausgang verlässt den Mischer rechts und steigt nach oben."
level_36_title = "Engpass"
level_36_short = "Engpass"
level_36_desc = "Vier Impulse passieren eine feste Leitung. Nur LIVE entscheidet noch über das Ziel."
level_36_hint = "Schalte nach jeder Passage bei D4 abwechselnd nach unten und oben. Beide Reaktoren brauchen zwei Impulse."
level_37_title = "Kontrollierte Verzögerung"
level_37_short = "Kontrollierte Verzögerung"
level_37_desc = "Die festen Kontakte lassen wenig Spielraum. Setze HOLD passend zur Plasmaquelle."
level_37_hint = "HOLD C2 auf 3. Die Fusion entsteht in C5 und steigt rechts zum oberen Ziel."
level_38_title = "Der lange Weg"
level_38_short = "Der lange Weg"
level_38_desc = "Eine Leitung schlängelt sich durch das Feld. Feste Winkel geben die Reihenfolge vor."
level_38_hint = "Erst die oberste Reihe nach rechts, die zweite nach links, dann über A3 in Reihe 4 nach rechts."
level_39_title = "Verriegelte Frequenz"
level_39_short = "Verriegelte Frequenz"
level_39_desc = "Zwei Fusionen arbeiten gleichzeitig in einem teilweise versiegelten Netzwerk."
level_39_hint = "Im unteren Kreis HOLD D5 auf 1. Die beiden Netzwerke teilen keine Leitung."
level_40_title = "Störfeldkern"
level_40_short = "Störfeldkern"
level_40_desc = "Stabilisiere drei Reaktoren trotz verriegelter Kontakte und vorgeschalteter Verzögerung."
level_40_hint = "B2 auf HOLD 1. D4 nach der ersten Fusion umlegen, F5 nach der zweiten."
level_41_title = "Doppelstern"
level_41_short = "Doppelstern"
level_41_desc = "Zwei synchronisierte Kreise erzeugen je drei Fusionen. Die Zielkapazitäten sind verbindlich."
level_41_hint = "C2 auf HOLD 2 und E5 auf HOLD 3. Lass beide Leitungen für die ganze Folge offen."
level_42_title = "Sechsfachpuls"
level_42_short = "Sechsfachpuls"
level_42_desc = "Sechs Fusion-Impulse teilen sich eine Leitung. Jeder Zielreaktor braucht drei Ladungen."
level_42_hint = "LIVE D3 fünfmal abwechselnd umlegen, jeweils nachdem ein Impuls passiert hat."
level_43_title = "Tiefe Resonanz"
level_43_short = "Tiefe Resonanz"
level_43_desc = "Zwei Verzögerungen synchronisieren drei Impulspaare. Eine falsche Einstellung zerstört die Folge."
level_43_hint = "D2 auf 3, D4 auf 2. Ihre Summe ist entscheidend für die Paarung im Mischer."
level_44_title = "Rückkehrsignal"
level_44_short = "Rückkehrsignal"
level_44_desc = "Der vierte Impuls muss wieder zum ersten Reaktor zurückkehren. Plane drei Schaltmomente."
level_44_hint = "C4 nach dem ersten Signal nach unten und nach dem dritten wieder nach oben. E5 trennt die mittleren Signale."
level_45_title = "Prismennetz"
