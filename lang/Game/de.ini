level_9_desc = "Finde beide Eingangswege zur Fusion und leite die neue Energie zum violetten Reaktor. Beachte den Sendeplan."
level_9_hint = "Die Raute nimmt Energie von oben und links an. Der gemeinsame Ausgang liegt rechts."
