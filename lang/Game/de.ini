level_1_desc = "Bringe den blauen Ion-Impuls zum offenen Reaktor. Drehe die Leitungen zu einem lückenlosen Weg."
level_2_desc = "Zwei Energien, zwei getrennte Wege. Führe jeden Impuls zu seinem passenden Reaktor, ohne die Leitungen zu kreuzen."
level_3_desc = "Vereine Ion und Plasma im Fusionsmodul. Nur die violette Fusion-Energie kann den Reaktor aktivieren."
level_4_desc = "Der Generator sendet zwei Impulse. Leite den ersten nach oben und schalte danach LIVE nach unten um."
level_5_desc = "Beide Impulse müssen im selben Takt eintreffen. Stelle die Verzögerung ein, bevor du die Energie startest."
level_6_desc = "Stelle zwei Fusion-Impulse her. Versorge zuerst den oberen, dann den unteren Stationskern. Hier zählt das Zusammenspiel."
level_1_hint = "Gehe vom Generator erst nach rechts, dann nach oben. Der Weg führt über die zweite Reihe nach rechts und dann zum Reaktor hinunter."
level_2_hint = "Ion nimmt den oberen Weg mit einem Bogen durch die Mitte. Plasma bleibt unten und steigt erst in Spalte C eine Reihe auf."
level_3_hint = "Ion kommt von oben, Plasma von links. Die Fusion verlässt die Raute rechts und biegt anschließend nach unten ab."
level_4_hint = "Warte, bis der erste Impuls den LIVE-Schalter passiert hat. Schalte zwischen Takt 3 und 7 nach unten."
level_5_hint = "Der rote Weg braucht vier Takte. Der blaue Weg braucht zwei plus Verzögerung: Stelle HOLD auf 2."
level_6_hint = "Mische in C4, leite über D4 zu LIVE in E4. Schalte nach dem ersten Durchlauf nach unten, spätestens vor Takt 13."
